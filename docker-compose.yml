# docker-compose.yml
services:
  # ───────────────────────────────────────────────
  # Kawadar API
  # ───────────────────────────────────────────────
  kawadar-api:
    container_name: "kawadar-api"
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080" # API (http://localhost:8080)
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Redis: "redis:6379,abortConnect=false"
      Ollama__BaseUrl: "http://ollama:11434"
      Qdrant__Host: "qdrant"
      Qdrant__Port: "6334"
      Gorse__ApiKey: ${GORSE_API_KEY}
    volumes:
      - api_logs:/app/Logs
    depends_on:
      rabbitmq:
        condition: service_healthy
      loki:
        condition: service_started
      gorse:
        condition: service_started
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped
    networks:
      - kawadar-network

  rabbitmq:
    container_name: "rabbitmq"
    image: rabbitmq:3-management
    ports:
      # Should be not exposed in production
      - "5672:5672" # RabbitMQ port
      - "15672:15672" # Management UI (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - kawadar-network

  # ───────────────────────────────────────────────
  # Monitoring Stack
  # ───────────────────────────────────────────────

  prometheus:
    container_name: "prometheus"
    image: prom/prometheus:latest
    ports:
      # Should be not exposed in production
      - "9090:9090" # Prometheus UI (http://localhost:9090)
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    depends_on:
      - kawadar-api
    restart: unless-stopped
    networks:
      - kawadar-network

  grafana:
    container_name: "grafana"
    image: grafana/grafana:latest
    ports:
      - "3000:3000" # Grafana UI (http://localhost:3000)
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - kawadar-network

  loki:
    container_name: "loki"
    image: grafana/loki:latest
    ports:
      # Should be not exposed in production
      - "3100:3100" # Loki API
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - kawadar-network

  promtail:
    container_name: "promtail"
    image: grafana/promtail:latest
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - api_logs:/var/log/kawadar:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
      - kawadar-api
    restart: unless-stopped
    networks:
      - kawadar-network

  # ───────────────────────────────────────────────
  # Gorse (Recommendation Engine)
  # ───────────────────────────────────────────────

  gorse-postgres:
    container_name: "gorse-postgres"
    image: postgres:16
    environment:
      POSTGRES_USER: ${GORSE_DB_USER}
      POSTGRES_PASSWORD: ${GORSE_DB_PASSWORD}
      POSTGRES_DB: gorse
    ports:
      # Should be not exposed in production
      - "5433:5432"
    volumes:
      - gorse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${GORSE_DB_USER} -d gorse" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - kawadar-network

  gorse:
    container_name: "gorse"
    image: zhenghaoz/gorse-in-one:latest
    ports:
      - "8087:8088" # Gorse REST API (gorse-in-one serves API on 8088)
      - "8088:8088" # Gorse dashboard UI (optional)
    environment:
      GORSE_CONFIG: /etc/gorse/config.toml
      GORSE_DATABASE_DATA_STORE: postgres://${GORSE_DB_USER}:${GORSE_DB_PASSWORD}@gorse-postgres:5432/gorse?sslmode=disable
      GORSE_DATABASE_CACHE_STORE: postgres://${GORSE_DB_USER}:${GORSE_DB_PASSWORD}@gorse-postgres:5432/gorse?sslmode=disable
      GORSE_MASTER_DASHBOARD_USER_NAME: ${GORSE_DASHBOARD_USER}
      GORSE_MASTER_DASHBOARD_PASSWORD: ${GORSE_DASHBOARD_PASSWORD}
      GORSE_SERVER_API_KEY: ${GORSE_API_KEY}
    volumes:
      - ./gorse/config.toml:/etc/gorse/config.toml:ro
    depends_on:
      gorse-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kawadar-network

  ## ───────────────────────────────────────────────
  # Redis (for caching)
  ## ───────────────────────────────────────────────
  redis:
    container_name: "redis"
    image: redis:7-alpine
    ports:
      # Should be not exposed in production
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes # persist data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - kawadar-network
    # ───────────────────────────────────────────────
    # RedisInsight (Redis Dashboard)
    # ───────────────────────────────────────────────
  redisinsight:
    container_name: "redisinsight"
    image: redis/redisinsight:latest
    ports:
      - "5540:5540" # UI (http://localhost:5540)
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kawadar-network

  # ───────────────────────────────────────────────
  # Qdrant (Vector Store for RAG)
  # ───────────────────────────────────────────────
  qdrant:
    container_name: "qdrant"
    image: qdrant/qdrant:latest
    ports:
      # Should be not exposed in production
      - "6333:6333" # Qdrant REST
      - "6334:6334" # Qdrant gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - kawadar-network

  # ───────────────────────────────────────────────
  # Ollama (Local AI — embeddings + LLM)
  # ───────────────────────────────────────────────
  ollama:
    container_name: "ollama"
    image: ollama/ollama
    ports:
      # Should be not exposed in production
      - "11434:11434" # Ollama API
    volumes:
      - ollama_data:/root/.ollama
    # Remove this part to deploy on vm has no GPU
    # -----------------------------------
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    # -----------------------------------
    restart: unless-stopped
    networks:
      - kawadar-network

  # ───────────────────────────────────────────────
  # Ollama model puller (runs once, then exits)
  # pulls: bge-m3 + qwen3.5:0.8b
  # ───────────────────────────────────────────────
  ollama-init:
    container_name: "ollama-init"
    image: ollama/ollama
    entrypoint: >
      /bin/sh -c "
        sleep 10 &&
        ollama pull bge-m3 && ollama pull qwen3.5:0.8b
      "
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama
    networks:
      - kawadar-network

  ngrok:
    container_name: "ngrok"
    image: ngrok/ngrok:latest
    command: http kawadar-api:8080 --log=stdout
    ports:
      - "4040:4040"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      - kawadar-api
    networks:
      - kawadar-network

  # ───────────────────────────────────────────────
  # Kawadar Frontend
  # ───────────────────────────────────────────────
  kawadar-frontend:
    container_name: "kawadar-frontend"
    build:
      context: ../Kawader-Frontend
      dockerfile: Dockerfile
    ports:
      - "80:80" # Frontend (http://localhost)
    depends_on:
      - kawadar-api
    restart: unless-stopped
    networks:
      - kawadar-network

networks:
  kawadar-network:
    driver: bridge

volumes:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  loki_data:
  api_logs:
  gorse_pg_data:
  redis_data:
  redisinsight_data:
  qdrant_data:
  ollama_data:
