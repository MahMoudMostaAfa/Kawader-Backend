global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Scrape Kawadar API metrics
  - job_name: "kawadar-api"
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets: ["kawadar-api:8080"]
        labels:
          app: "kawadar-api"
          environment: "development"
