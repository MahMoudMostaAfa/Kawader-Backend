server:
  http_listen_port: 0
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: kawadar-api-logs
    static_configs:
      - targets:
          - localhost
        labels:
          app: kawadar-api
          __path__: /var/log/kawadar/*.log
