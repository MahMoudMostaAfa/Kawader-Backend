name: CI - Build & Test & Push API

on:
  # Push to main runs tests and builds the image and pushes to Docker Hub
  push:
    branches: [main]
  # PRs run validation only (tests)
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Restore, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore Kawadar.slnx

      - name: Build solution
        run: dotnet build Kawadar.slnx --configuration Release --no-restore

      - name: Run Domain unit tests
        run: dotnet test tests/kawadar.Domain.UnitTests/kawadar.Domain.UnitTests.csproj --configuration Release --no-build --verbosity normal --results-directory ./test-results

      - name: Run Application unit tests
        run: dotnet test tests/Kawadar.Application.UnitTests/Kawadar.Application.UnitTests.csproj --configuration Release --no-build --verbosity normal --results-directory ./test-results

      - name: Run Application subcutaneous tests
        run: dotnet test tests/kawadar.Application.SubcutaneousTests/kawadar.Application.SubcutaneousTests.csproj --configuration Release --no-build --verbosity normal --results-directory ./test-results

      - name: Run API integration tests
        run: dotnet test tests/kawadar.Api.IntegrationTests/kawadar.Api.IntegrationTests.csproj --configuration Release --no-build --verbosity normal --results-directory ./test-results

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    # Only build and push if tests pass and it is a direct push/merge to the main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kawadar-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kawadar-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api