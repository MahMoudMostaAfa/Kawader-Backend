# Gorse server configuration

[database]
# Use Postgres for both data store and cache store
# These values are overridden by GORSE_DATABASE_DATA_STORE and GORSE_DATABASE_CACHE_STORE environment variables in docker-compose.yml
data_store = "postgres://user:password@gorse-postgres:5432/gorse?sslmode=disable"
cache_store = "postgres://user:password@gorse-postgres:5432/gorse?sslmode=disable"

[master]
# REST API settings (used by gorse-in-one)
http_host = "0.0.0.0"
http_port = 8088
n_jobs = 1
# These values are overridden by GORSE_MASTER_DASHBOARD_USER_NAME and GORSE_MASTER_DASHBOARD_PASSWORD environment variables in docker-compose.yml
dashboard_user_name = "user"
dashboard_password = "password"

[server]
# This value is overridden by GORSE_SERVER_API_KEY environment variable in docker-compose.yml
api_key = "api-key"

[recommend]
cache_size = 100

[recommend.data_source]
positive_feedback_types = ["star", "like"]
read_feedback_types = ["view"]
positive_feedback_ttl = 0
item_ttl = 0

[recommend.collaborative]
# Enable matrix factorization
type = "mf"
# Train every 2 minutes (for testing; use 60m in production)
fit_period = "2m"
fit_epoch = 100

[recommend.ranker]
fit_period = "2m"

[recommend.replacement]
enable_replacement = false

[monitor]
# Prometheus metrics endpoint (optional)
enable_metrics = true
metrics_port = 9100

[log]
# Log level: debug, info, warn, error
level = "info"